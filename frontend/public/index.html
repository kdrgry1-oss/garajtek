        <script>
            /* GÜVENLİK: şifre sıfırlama jetonu adres çubuğundan HEMEN silinir → analitik/piksel/beacon
               araçlarına (tam URL gönderenlere) sızmaz. Sayfa jetonu sessionStorage'dan okur. */
            (function () {
                try {
                    var u = new URL(location.href);
                    var t = u.searchParams.get("token");
                    if (t && u.pathname.indexOf("/sifre-sifirla") === 0) {
                        sessionStorage.setItem("pw_reset_token", t);
                        u.searchParams.delete("token");
                        history.replaceState(history.state, "", u.pathname + u.search + u.hash);
                    }
                } catch (e) { /* noop */ }
            })();
        </script>

        <!-- TEK ALAN ADI: www.<alan> → <alan> (canonical ile aynı). İki ayrı origin ayrı
             localStorage demek: panele www'de giren personel, www'suz açılan ürün sayfasında
             oturumsuz görünüyor (düzenle kalemi çıkmıyor), müşterinin sepeti/oturumu ikiye
             bölünüyordu. İlk geçişte oturum/sepet vb. localStorage verisi URL #fragment ile
             (sunucuya/Referer'a gitmez) taşınır; hedef yalnız www'den gelen (Referer) ve
             60 sn içindeki veriyi, KENDİNDE OLMAYAN anahtarlara yazar, sonra adresi temizler.
             CANON, aşağıdaki <link rel="canonical"> ile aynı olmalı. -->
        <script>
            (function () {
                try {
                    // Alan adı build-time env'den gelir (REACT_APP_CANONICAL_HOST, ör. "ornek.com").
                    // Boşsa/tanımsızsa yönlendirme/taşıma HİÇ yapılmaz.
                    var CANON = "%REACT_APP_CANONICAL_HOST%";
                    if (!CANON || CANON.charAt(0) === "%") return;
                    var h = location.hostname, K = "__lsmig=";
                    if (h === "www." + CANON) {
                        var hash = location.hash || "";
                        if (hash.indexOf("#" + K) === 0) hash = "";   // dışarıdan gelen taşıma verisi yok sayılır
                        var d = {}, tot = 0;
                        try {
                            for (var i = 0; i < localStorage.length; i++) {
                                var k = localStorage.key(i), v = localStorage.getItem(k);
                                if (v != null && v.length <= 60000 && tot + v.length <= 400000) { d[k] = v; tot += v.length; }
                            }
                        } catch (e) { /* depolama kapalı */ }
                        var frag = hash;
                        if (tot > 0) {
                            try {
                                var pay = btoa(unescape(encodeURIComponent(JSON.stringify({ t: Date.now(), d: d }))));
                                frag = "#" + K + encodeURIComponent(pay) + (hash ? "&__h=" + encodeURIComponent(hash.slice(1)) : "");
                            } catch (e) { frag = hash; }
                        }
                        location.replace("https://" + CANON + location.pathname + location.search + frag);
                        return;
                    }
                    if (h === CANON && location.hash.indexOf("#" + K) === 0) {
                        var raw = location.hash.slice(1), parts = raw.split("&__h=");
                        var rest = parts[1] ? "#" + decodeURIComponent(parts[1]) : "";
                        try { history.replaceState(null, "", location.pathname + location.search + rest); } catch (e) { /* yoksay */ }
                        var ref = document.referrer || "";
                        if (ref.indexOf("https://www." + CANON + "/") === 0) {
                            var obj = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(parts[0].slice(K.length))))));
                            if (obj && obj.d && Math.abs(Date.now() - Number(obj.t || 0)) < 60000) {
                                for (var key in obj.d) {
                                    if (Object.prototype.hasOwnProperty.call(obj.d, key) && localStorage.getItem(key) == null) {
                                        localStorage.setItem(key, String(obj.d[key]));
                                    }
                                }
                            }
                        }
                    }
                } catch (e) { /* yönlendirme/taşıma hatası siteyi bozmasın */ }
            })();
        </script>
        <!-- İstemci yüklenme/hata telemetrisi — EN ÖNCE (bundle çökmesini bile yakalar).
             Sunucu IP+UA damgalar; admin panelden hangi cihaz/IP açıldı/açılamadı + hata görülür. -->
        <script>
            (function () {
                try {
                    var API = "%REACT_APP_BACKEND_URL%";
                    if (!API || API.charAt(0) === "%") {
                        // white-label fallback: www.<domain> -> api.<domain>
                        API = location.origin.replace("://www.", "://api.");
                        if (API === location.origin) API = location.origin.replace("://", "://api.");
                    }
                    var SENT = {};
                    function conn() {
                        try { var c = navigator.connection; return c ? (c.effectiveType || "") : ""; } catch (e) { return ""; }
                    }
                    function beacon(status, extra) {
                        try {
                            if (status === "ok" && SENT.ok) return;
                            if (status === "ok") SENT.ok = 1;
                            var p = {
                                status: status, url: location.href, referrer: document.referrer || "",
                                screen: (window.screen ? (screen.width + "x" + screen.height) : ""), conn: conn()
                            };
                            if (extra) { for (var k in extra) { if (extra.hasOwnProperty(k)) p[k] = extra[k]; } }
                            var body = JSON.stringify(p);
                            var url = API + "/api/client-log";
                            // text/plain: CORS 'simple request' → preflight yok; sunucu JSON'u yine ayrıştırır.
                            if (navigator.sendBeacon) {
                                navigator.sendBeacon(url, new Blob([body], { type: "text/plain;charset=UTF-8" }));
                            } else {
                                var x = new XMLHttpRequest();
                                x.open("POST", url, true);
                                x.setRequestHeader("Content-Type", "text/plain;charset=UTF-8");
                                x.send(body);
                            }
                        } catch (e) {}
                    }
                    window.__fctBeacon = beacon;
                    window.addEventListener("error", function (e) {
                        beacon("error", {
                            message: (e && e.message) ? String(e.message).slice(0, 500) : "",
                            source: (e && e.filename) ? String(e.filename).slice(0, 200) : "",
                            line: (e && e.lineno) || 0, col: (e && e.colno) || 0
                        });
                    });
                    window.addEventListener("unhandledrejection", function (e) {
                        var m = "";
                        try { m = (e && e.reason && (e.reason.message || e.reason)) || ""; } catch (x) {}
                        beacon("unhandledrejection", { message: String(m).slice(0, 500) });
                    });
                    // React render çökmesi window.onerror'a düşmez → console.error'a gider. Onu da yakala
                    // (mount_fail'in GERÇEK sebebini görmek için). Yalnız hata-benzeri mesajları beacon'la.
                    try {
                        var _ce = console.error;
                        var _ceSent = 0;
                        console.error = function () {
                            try {
                                if (_ceSent < 4) {
                                    var a = arguments[0];
                                    var m = (a && a.stack) ? a.stack : (a && a.message ? a.message : String(a || ""));
                                    if (arguments[1] && arguments[1].stack) m = m + " :: " + arguments[1].stack;
                                    if (m && /error|cannot read|undefined is not|null is not|is not a function|not defined|Minified React/i.test(m)) {
                                        _ceSent++;
                                        beacon("error", { message: String(m).slice(0, 600), source: "console" });
                                    }
                                }
                            } catch (x) {}
                            return _ce.apply(console, arguments);
                        };
                    } catch (x) {}
                    // Uygulama mount olursa 'ok' beacon (bir kez). React #root'a çocuk ekleyince.
                    var okTries = 0;
                    var okT = setInterval(function () {
                        okTries++;
                        var r = document.getElementById("root");
                        if (r && r.children && r.children.length > 0) { beacon("ok"); clearInterval(okT); }
                        else if (okTries > 40) clearInterval(okT); // ~8sn sonra bırak (mount_fail'i self-heal atar)
                    }, 200);
                } catch (e) {}
            })();
        </script>
        <!-- REKLAM / UYGULAMA-İÇİ TARAYICI CSS SELF-HEAL:
             Instagram/Facebook in-app browser 'no-cache'i yok sayıp ESKİ index.html'i cache'leyebiliyor
             → yeni deploy'da hash'i değişen main.[hash].css 404 olur → sayfa STİLSİZ (bozuk) açılır
             (reklamdan gelen ilk ziyaret). CSS gerçekten yüklendi mi kontrol et; DOM'da <link> VAR ama
             document.styleSheets'te YOK ise (404/yüklenemedi) cache-bypass ile BİR KEZ hard-reload et.
             sessionStorage kilidi döngüyü engeller. Çalışan sayfada reload OLMAZ (yanlış-pozitif yok). -->
        <script>
            (function () {
                function cssInSheets() {
                    try {
                        for (var i = 0; i < document.styleSheets.length; i++) {
                            if ((document.styleSheets[i].href || "").indexOf("/static/css/") !== -1) return true;
                        }
                    } catch (e) {}
                    return false;
                }
                window.addEventListener("load", function () {
                    setTimeout(function () {
                        try {
                            var linkPresent = !!document.querySelector('link[rel="stylesheet"][href*="/static/css/"]');
                            if (linkPresent && !cssInSheets() && !sessionStorage.getItem("__fct_css_heal")) {
                                sessionStorage.setItem("__fct_css_heal", "1");
                                try { if (window.__fctBeacon) window.__fctBeacon("css_missing_reload", { href: location.href }); } catch (e) {}
                                var u = location.href;
                                u += (u.indexOf("?") === -1 ? "?" : "&") + "_cb=" + Date.now();  // cache-bypass
                                location.replace(u);
                            }
                        } catch (e) {}
                    }, 1500);
                });
            })();
        </script>

                function loadGTM() {

                    var f = d.getElementsByTagName(s)[0],
                        j = d.createElement(s),

                    f.parentNode.insertBefore(j, f);

                else { setTimeout(loadGTM, 2500); }
            })(window, document, 'script', 'dataLayer', '%REACT_APP_GTM_ID%');
        </script>

        <script>
            // CSS SELF-HEAL: Instagram/Facebook gibi in-app tarayıcılar 'no-cache' başlığını yok
            // sayıp eski index.html'i önbelleğe alabiliyor → yeni deploy'un hash'li CSS'ine 404 →
            // site STİLSİZ (ham HTML, üst üste) açılıyor. Yüklemeden sonra ana CSS gerçekten
            // uygulanmış mı kontrol et; uygulanmadıysa cache-bust'lı bir kez tazele (sessionStorage
            // bayrağı sonsuz döngüyü önler).
            (function () {
                // Bir kez tazelendiyse TEKRAR deneme. Guard hem URL param (_r) hem sessionStorage:
                // in-app tarayıcıda (Instagram/FB/WhatsApp) sessionStorage sıfırlanabildiğinden URL
                // param'ı KALICI guard'dır → sonsuz reload döngüsü OLMAZ.
                function healedAlready() {
                    if (/[?&]_r=/.test(location.search)) return true;
                    try { return sessionStorage.getItem("__heal") === "1"; } catch (e) { return false; }
                }
                function cssApplied() {
                    var links = document.querySelectorAll('link[rel="stylesheet"][href*="/static/css/"]');
                    if (!links.length) return true; // CSS linki yoksa (inline stil) kontrol etme
                    var sheets = document.styleSheets;
                    for (var i = 0; i < sheets.length; i++) {
                        var href = sheets[i].href || "";
                        if (href.indexOf("/static/css/") > -1) {
                            try {
                                if (sheets[i].cssRules && sheets[i].cssRules.length > 0) return true;
                            } catch (e) { return true; } // erişilemiyorsa yüklenmiş say (güvenli)
                        }
                    }
                    return false;
                }
                // MOBİL BEYAZ EKRAN: eski cache'lenmiş index.html silinmiş JS bundle'a 404 verince
                // React #root'a HİÇBİR ŞEY basamaz → bomboş ekran. Bunu "mount oldu mu" ile yakala.
                function appMounted() {
                    var r = document.getElementById("root");
                    return !!(r && r.children && r.children.length > 0);
                }
                // ?_r= KULLANICIYA GÖSTERİLMEZ. Bu parametre yalnızca önbellek atlatma + sonsuz
                // döngü guard'ıdır; adres çubuğunda kalması gereksiz ve profesyonelce değil
                // (hiçbir normal site böyle bir iz bırakmaz). Uygulama BAŞARIYLA açıldığı anda
                // history.replaceState ile sessizce silinir — sayfa yeniden yüklenmez, geçmiş
                // kirlenmez. Başarısızlıkta SİLİNMEZ, çünkü orada döngü guard'ı olarak gerekli.
                function stripHealParam() {
                    try {
                        if (location.search.indexOf("_r=") === -1) return;
                        if (!window.history || !history.replaceState) return;
                        var parts = location.search.replace(/^\?/, "").split("&");
                        var keep = [];
                        for (var i = 0; i < parts.length; i++) {
                            if (parts[i] && parts[i].indexOf("_r=") !== 0) keep.push(parts[i]);
                        }
                        var s = keep.length ? "?" + keep.join("&") : "";
                        history.replaceState(null, "", location.pathname + s + location.hash);
                    } catch (e) {}
                }
                // Mount olur olmaz temizle (check() 3.5 sn beklediğinden parametre o kadar süre
                // görünür kalmasın). En fazla ~12 sn dener, sonra bırakır.
                (function () {
                    if (location.search.indexOf("_r=") === -1) return;
                    var tries = 0;
                    var t = setInterval(function () {
                        tries++;
                        var r = document.getElementById("root");
                        if (r && r.children && r.children.length > 0) { stripHealParam(); clearInterval(t); }
                        else if (tries > 60) clearInterval(t);
                    }, 200);
                })();

                // Tazeleme denendi ama uygulama yine açılmadı → SESSİZ BEYAZ EKRAN BIRAKMA.
                // Sebep genelde ÇOK ESKİ TARAYICI (bundle'daki modern sözdizimi parse edilemez)
                // ya da JS'i engelleyen bir eklenti/kurumsal filtredir; ikisi de reload ile
                // düzelmez. Kullanıcı en azından ne olduğunu görsün ve destek için tarayıcı
                // bilgisini iletebilsin. NOT: Bu blok ESKİ tarayıcıda da çalışmalı → sadece ES5
                // (var / function / string birleştirme; ok fonksiyonu, const, template literal YOK).
                function showFallback() {
                    try {
                        var r = document.getElementById("root");
                        if (!r || (r.children && r.children.length > 0)) return;
                        try { if (window.__fctBeacon) window.__fctBeacon("mount_fail", { heal: true }); } catch (e) {}
                        var ua = (navigator && navigator.userAgent) ? navigator.userAgent : "";
                        r.innerHTML =
                            '<div style="min-height:70vh;display:flex;flex-direction:column;align-items:center;' +
                            'justify-content:center;gap:14px;padding:24px;text-align:center;' +
                            'font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif">' +
                            '<div style="font-size:18px;font-weight:700;color:#111">Sayfa yüklenemedi</div>' +
                            '<div style="font-size:14px;color:#666;max-width:380px;line-height:1.5">' +
                            'Tarayıcınız bu sayfayı açamadı. Lütfen tarayıcınızı güncelleyin ya da ' +
                            'Chrome/Edge/Safari\'nin güncel bir sürümüyle deneyin. Reklam engelleyici ' +
                            'veya kurumsal güvenlik filtresi de sayfayı engelliyor olabilir.</div>' +
                            '<button id="fct-retry" style="padding:10px 22px;background:#111;color:#fff;' +
                            'border:none;border-radius:2px;font-size:13px;cursor:pointer">Tekrar dene</button>' +
                            '<div style="font-size:10px;color:#bbb;max-width:380px;word-break:break-all">' + ua + '</div>' +
                            '</div>';
                        var b = document.getElementById("fct-retry");
                        if (b) b.onclick = function () {
                            try { sessionStorage.removeItem("__heal"); } catch (e) {}
                            location.replace(location.pathname);
                        };
                    } catch (e) {}
                }
                // Basit tazeleme: mevcut <link>'in AYNI href'ini cache-bust ile yeniden ekle.
                // NOT: href BAYAT/ölü bir hash ise bu işe yaramaz (sunucu SPA fallback'i 200+HTML
                // döndürdüğü için "CSS diye HTML" gelir → 0 kural). Bu yüzden yalnızca son çare.
                function reinjectSameHref() {
                    try {
                        var l = document.querySelector('link[rel="stylesheet"][href*="/static/css/"]');
                        if (!l) return;
                        var href = l.getAttribute("href");
                        if (/[?&]_c=/.test(href)) return;
                        var n = document.createElement("link");
                        n.rel = "stylesheet";
                        n.href = href + (href.indexOf("?") > -1 ? "&" : "?") + "_c=" + Date.now();
                        document.head.appendChild(n);
                    } catch (e) {}
                }
                // GÜÇLÜ TAZELEME (kök çözüm): DOM'daki (muhtemelen bayat) href'e GÜVENME. Taze
                // index.html'i cache:'reload' ile çek, GÜNCEL /static/css/main.<hash>.css yolunu
                // oradan çıkar ve onu enjekte et. Böylece in-app tarayıcı eski HTML'i cache'lese
                // bile GÜNCEL CSS uygulanır — tam reload (beyaz flash) gerekmez.
                function reinjectFreshCss() {
                    try {
                        if (typeof fetch !== "function") { reinjectSameHref(); return; }
                        fetch("/?_shf=" + Date.now(), { cache: "reload" })
                            .then(function (r) { return r.text(); })
                            .then(function (html) {
                                var m = html.match(/\/static\/css\/main\.[A-Za-z0-9]+\.css/);
                                var cssHref = m ? m[0] : null;
                                if (!cssHref) { reinjectSameHref(); return; }
                                var sheets = document.styleSheets;
                                for (var i = 0; i < sheets.length; i++) {
                                    if ((sheets[i].href || "").indexOf(cssHref) > -1) {
                                        try { if (sheets[i].cssRules && sheets[i].cssRules.length > 0) return; }
                                        catch (e) { return; }
                                    }
                                }
                                var n = document.createElement("link");
                                n.rel = "stylesheet";
                                n.href = cssHref + "?_c=" + Date.now();
                                document.head.appendChild(n);
                                try { if (window.__fctBeacon) window.__fctBeacon("css_reinject_fresh", { href: cssHref }); } catch (e) {}
                                // Enjekte ettik ama uygulanmadıysa (nadir) son çare: bir kez taze reload.
                                setTimeout(function () {
                                    if (!cssApplied() && !healedAlready()) {
                                        try { sessionStorage.setItem("__heal", "1"); } catch (e) {}
                                        var u = location.pathname +
                                            (location.search ? location.search + "&" : "?") + "_r=" + Date.now() +
                                            location.hash;
                                        location.replace(u);
                                    }
                                }, 2500);
                            })
                            .catch(function () { reinjectSameHref(); });
                    } catch (e) { reinjectSameHref(); }
                }
                function check() {
                    try {
                        // YALNIZ #root GERÇEKTEN boşken reload et. Mount OLMUŞ sayfayı CSS
                        // yanlış-negatifi (stylesheet DOM'da ama cssRules o an okunamıyor) yüzünden
                        // ASLA reload etme — gereksiz beyaz flash + scroll sıfırlama olurdu.
                        if (appMounted()) {
                            try { sessionStorage.removeItem("__heal"); } catch (e) {}
                            stripHealParam(); // URL temizlensin — kullanıcı ?_r= görmesin
                            if (!cssApplied()) reinjectFreshCss(); // reload yerine taze HTML'den GÜNCEL CSS'i enjekte et
                            return; // uygulama açık — her şey yolunda
                        }
                        if (healedAlready()) { showFallback(); return; } // bir kez denendi; döngü YOK → sessiz beyaz ekran yerine MESAJ
                        try { sessionStorage.setItem("__heal", "1"); } catch (e) {}
                        try { if (window.__fctBeacon) window.__fctBeacon("heal_reload"); } catch (e) {}
                        var u = location.pathname +
                            (location.search ? location.search + "&" : "?") + "_r=" + Date.now() +
                            location.hash;
                        location.replace(u); // cache-bust ile TAZE index.html + taze bundle çek
                    } catch (e) {}
                }
                // React mount + CSS için cömert süre (yavaş mobil ağ / in-app tarayıcıda erken/YANLIŞ
                // reload etme — 3.5sn çok kısaydı, mount olacakken 'bekleyip redirect' yapıyordu). 6.5sn.
                function schedule() { setTimeout(check, 6500); }
                if (document.readyState === "complete") schedule();
                else window.addEventListener("load", schedule);
            })();
        </script>
    </body>
</html>
