# garajtek — mağaza (SPA) + API ters vekil. install.sh bu şablonu
# /etc/nginx/sites-available/garajtek olarak yazar (__DOMAIN__ yerine alan adı).
# Elle değiştirdiyseniz: nginx -t && systemctl reload nginx
#
# Trafik yolu:  ziyaretçi → Cloudflare (turuncu bulut, SSL "Full (strict)") → bu sunucu :443
# Sertifika:    Cloudflare Origin Certificate → /etc/ssl/cloudflare/__DOMAIN__.pem / .key
# Gerçek IP:    /etc/nginx/conf.d/garajtek-cloudflare.conf (CF-Connecting-IP, yalnız CF aralıklarından)
# CF kilidi:    /etc/nginx/snippets/garajtek-cf-lock.conf → CF dışından gelen isteği keser (444)

# HTML asla önbelleğe alınmasın (yeni sürüm anında görünsün); diğer kök dosyalar 1 gün.
map $sent_http_content_type $garajtek_cache_control {
    ~*text/html  "no-cache";
    default      "public, max-age=86400";
}

upstream garajtek_api {
    server 127.0.0.1:8001;
    keepalive 16;
}

# --- www → çıplak alan adı ----------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;
    ssl_certificate     /etc/ssl/cloudflare/__DOMAIN__.pem;
    ssl_certificate_key /etc/ssl/cloudflare/__DOMAIN__.key;
    include /etc/nginx/snippets/garajtek-cf-lock.conf;
    return 301 https://__DOMAIN__$request_uri;
}

# --- Ana site: SPA + /api + /media --------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/ssl/cloudflare/__DOMAIN__.pem;
    ssl_certificate_key /etc/ssl/cloudflare/__DOMAIN__.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:garajtek_ssl:10m;

    include /etc/nginx/snippets/garajtek-cf-lock.conf;

    root /var/www/garajtek;
    index index.html;

    # Görsel 25 MB, video 100 MB (Cloudflare Free/Pro istek gövdesi sınırı da 100 MB'tır).
    client_max_body_size 110m;

    access_log /var/log/nginx/garajtek.access.log;
    error_log  /var/log/nginx/garajtek.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml
               image/svg+xml application/manifest+json text/xml;

    # ACME (certbot webroot) — ortak kök; posta/ileride LE sertifikası için.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # API → uvicorn (tek işçi, 127.0.0.1:8001)
    location /api/ {
        proxy_pass http://garajtek_api;
        include /etc/nginx/snippets/garajtek-proxy.conf;
    }

    # Backend'in kök seviyede ürettiği dinamik SEO dosyaları
    location = /sitemap.xml { proxy_pass http://garajtek_api; include /etc/nginx/snippets/garajtek-proxy.conf; }
    location = /robots.txt  { proxy_pass http://garajtek_api; include /etc/nginx/snippets/garajtek-proxy.conf; }
    location = /llms.txt    { proxy_pass http://garajtek_api; include /etc/nginx/snippets/garajtek-proxy.conf; }

    # Yüklenen görseller/videolar (MEDIA_DIR). Dosya adları uuid → değişmez → 1 yıl önbellek.
    location /media/ {
        alias /opt/garajtek/media/;
        try_files $uri =404;
        autoindex off;
        include /etc/nginx/snippets/garajtek-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Yüklemeler yalnız raster görsel/video/PDF'tir; yine de tarayıcıya script çalıştırma izni verme.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # CRA hash'li paketler — değişmez. Eksik dosya index.html'e DÜŞMEZ (404).
    location /static/ {
        try_files $uri =404;
        include /etc/nginx/snippets/garajtek-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Eski URL → yeni (frontend/public/_redirects ile aynı)
    location ~ ^/siparis-tamamlandi/(.*)$ {
        return 301 /order-success/$1;
    }

    # SPA: bilinmeyen yollar index.html (React yönlendirir). HTML no-cache.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/garajtek-security-headers.conf;
        add_header Cache-Control $garajtek_cache_control always;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# --- Seçenek B: API ayrı alt alan adında (frontend Cloudflare Pages'te ise) ----
# DNS'te api.__DOMAIN__ kaydı yoksa bu blok hiç kullanılmaz; zararsızdır.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.__DOMAIN__;

    ssl_certificate     /etc/ssl/cloudflare/__DOMAIN__.pem;
    ssl_certificate_key /etc/ssl/cloudflare/__DOMAIN__.key;

    include /etc/nginx/snippets/garajtek-cf-lock.conf;

    client_max_body_size 110m;
    access_log /var/log/nginx/garajtek-api.access.log;
    error_log  /var/log/nginx/garajtek.error.log warn;

    location /media/ {
        alias /opt/garajtek/media/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    location / {
        proxy_pass http://garajtek_api;
        include /etc/nginx/snippets/garajtek-proxy.conf;
    }
}
