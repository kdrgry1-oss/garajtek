# garajtek → uvicorn ters vekil ayarları (/etc/nginx/snippets/garajtek-proxy.conf)
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# $remote_addr = gerçek ziyaretçi IP'si (realip modülü CF-Connecting-IP'den çözer).
# XFF ÜZERİNE YAZILIR (eklenmez) → istemci sahte XFF gönderemez. uvicorn --proxy-headers
# bunu request.client.host olarak kullanır. CF-Connecting-IP ve X-Edge-Secret başlıkları
# olduğu gibi iletilir (backend CF_EDGE_SECRET ile doğrular).
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 10s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
