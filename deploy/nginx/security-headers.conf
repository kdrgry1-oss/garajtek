# Statik yanıtlar için güvenlik başlıkları (/etc/nginx/snippets/garajtek-security-headers.conf).
# frontend/public/_headers (Cloudflare Pages) ile aynı içerik. API yanıtlarının başlıklarını backend verir.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(), payment=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
