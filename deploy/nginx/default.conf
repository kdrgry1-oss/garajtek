# Varsayılan sunucular — install.sh bunu /etc/nginx/sites-available/garajtek-default olarak yazar
# (Ubuntu'nun "default" sitesinin yerine).
#
# :80  → ACME http-01 doğrulaması için ortak kök (/var/www/html; certbot --webroot -w /var/www/html)
#        + diğer her şeyi HTTPS'e yönlendirir. Posta (mail.<alan>) kendi server bloğunu ekleyebilir.
# :443 → tanınmayan alan adı / çıplak IP ile gelen TLS el sıkışmasını reddeder (sertifika sızdırmaz).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
